name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Re-create the release and re-publish even if the tag already exists
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a recent npm; the one bundled with Node 22 is too old.
      - name: Use a npm that speaks OIDC
        run: npm install -g npm@latest

      - name: Read version and tag state
        id: meta
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version already tagged; skipping release"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is new; release will be created"
          fi

      - name: Verify the client module parses
        run: node --check client.js || node -e "new Function(require('node:fs').readFileSync('client.js','utf8'))"

      - name: Extract the changelog section
        if: steps.meta.outputs.exists == 'false' || inputs.force
        run: node .github/scripts/changelog-section.mjs "${{ steps.meta.outputs.version }}" > "$RUNNER_TEMP/notes.md"

      - name: Create tag and GitHub release
        if: steps.meta.outputs.exists == 'false' || inputs.force
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Idempotent: a forced re-run must not die on an existing tag or release.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::notice::$TAG already exists locally; reusing it"
          else
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::release $TAG already exists; leaving it alone"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --verify-tag
          fi

      # setup-node writes an _authToken line into .npmrc. Leaving it there makes npm
      # authenticate with an empty token instead of exchanging the OIDC identity, which
      # fails as EOTP/ENEEDAUTH. Strip it so trusted publishing is the only path used.
      - name: Drop the token placeholder so OIDC is used
        if: steps.meta.outputs.exists == 'false' || inputs.force
        run: |
          if [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            grep -v '_authToken' "$NPM_CONFIG_USERCONFIG" > "$RUNNER_TEMP/npmrc" || true
            mv "$RUNNER_TEMP/npmrc" "$NPM_CONFIG_USERCONFIG"
          fi
          echo "npm $(npm --version) on node $(node --version)"

      - name: Publish to npm with trusted publishing
        if: steps.meta.outputs.exists == 'false' || inputs.force
        run: npm publish --access public

      # A second copy on GitHub Packages, so the plugin can be installed without ever
      # talking to the public npm registry. publishConfig.registry outranks --registry,
      # so the field itself is repointed for this one publish and restored afterwards.
      # Runs even when the npm step above failed: the two registries are independent.
      - name: Publish to GitHub Packages
        if: always() && (steps.meta.outputs.exists == 'false' || inputs.force)
        env:
          GH_PACKAGES_TOKEN: ${{ github.token }}
        run: |
          echo "//npm.pkg.github.com/:_authToken=$GH_PACKAGES_TOKEN" >> "$NPM_CONFIG_USERCONFIG"
          cp package.json "$RUNNER_TEMP/package.json.orig"
          npm pkg set publishConfig.registry=https://npm.pkg.github.com
          if npm publish --access public; then
            echo "::notice::published to GitHub Packages"
          else
            echo "::warning::GitHub Packages publish failed; the npm registry copy is unaffected"
          fi
          cp "$RUNNER_TEMP/package.json.orig" package.json
